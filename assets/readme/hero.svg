<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="tap-hero-title tap-hero-desc">
  <title id="tap-hero-title">homebrew-ygn：ygnstudio 的 Homebrew tap</title>
  <desc id="tap-hero-desc">左侧是 tap 名称、一句说明和 tap 命令；右侧是三张 macOS 小工具的卡片：FinderWrap、Duty、Blinker。</desc>
  <defs>
    <linearGradient id="tap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101419"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="tap-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2430"/>
      <stop offset="1" stop-color="#171D27"/>
    </linearGradient>
    <radialGradient id="tap-glow" cx="0.84" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#tap-bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#tap-glow)"/>

  <!-- Left: identity -->
  <text x="56" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#7C8AA0">HOMEBREW TAP</text>
  <text x="56" y="140" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#F4F7FB">ygnstudio/tap</text>
  <text x="56" y="184" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#A9B6C9">我维护的 macOS 小工具，</text>
  <text x="56" y="212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#A9B6C9">一个 tap 统一安装、升级、卸载。</text>

  <rect x="56" y="234" width="322" height="44" rx="12" fill="#16233A" stroke="#2C3846"/>
  <circle cx="82" cy="256" r="4" fill="#4C8DFF"/>
  <text x="98" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E9EEF6">brew tap ygnstudio/ygn</text>

  <!-- Right: three app cards -->
  <g>
    <rect x="628" y="56" width="172" height="188" rx="16" fill="url(#tap-card)" stroke="#2A3543"/>
    <g transform="translate(652,80)">
      <rect x="0" y="0" width="14" height="12" rx="3" fill="#8FA3BE"/>
      <rect x="20" y="0" width="14" height="12" rx="3" fill="#8FA3BE" opacity="0.6"/>
      <rect x="40" y="0" width="14" height="12" rx="3" fill="#8FA3BE" opacity="0.4"/>
      <path d="M47 6 V26 a5 5 0 0 1 -5 5 H16 a5 5 0 0 0 -5 5 V44" fill="none" stroke="#4C8DFF" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M5 40 L11 50 L17 40 Z" fill="#4C8DFF"/>
    </g>
    <text x="652" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#F4F7FB">FinderWrap</text>
    <text x="652" y="192" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">Finder 图标视图</text>
    <text x="652" y="212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">左右键跨行</text>
    <text x="652" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7F8DA1">1.0.14 · arm64</text>
  </g>

  <g>
    <rect x="820" y="56" width="172" height="188" rx="16" fill="url(#tap-card)" stroke="#2A3543"/>
    <g transform="translate(844,80)">
      <rect x="2" y="2" width="32" height="40" rx="7" fill="none" stroke="#8FA3BE" stroke-width="2.5"/>
      <rect x="22" y="12" width="24" height="32" rx="7" fill="#16233A" stroke="#4C8DFF" stroke-width="2.5"/>
      <path d="M29 22 h10 M29 30 h10" stroke="#4C8DFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="844" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#F4F7FB">Duty</text>
    <text x="844" y="192" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">把扩展名锁到</text>
    <text x="844" y="212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">指定的默认应用</text>
    <text x="844" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7F8DA1">1.0.0 · arm64</text>
  </g>

  <g>
    <rect x="1012" y="56" width="172" height="188" rx="16" fill="url(#tap-card)" stroke="#2C3846"/>
    <g transform="translate(1036,80)">
      <circle cx="8" cy="12" r="6" fill="#8FA3BE"/>
      <circle cx="30" cy="12" r="6" fill="#8FA3BE" opacity="0.6"/>
      <circle cx="52" cy="12" r="6" fill="#4C8DFF"/>
      <rect x="2" y="30" width="56" height="14" rx="7" fill="none" stroke="#8FA3BE" stroke-width="2.5"/>
      <path d="M40 37 h12" stroke="#4C8DFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="1036" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#F4F7FB">Blinker</text>
    <text x="1036" y="192" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">红绿灯行为</text>
    <text x="1036" y="212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16.5" fill="#A9B6C9">重定义与悬停放大</text>
    <text x="1036" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7F8DA1">0.7.0 · universal</text>
  </g>
</svg>
